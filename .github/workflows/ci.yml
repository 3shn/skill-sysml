name: ci

on:
  push:
    branches: [main]
  pull_request:

# nc1's self-hosted runner (repository variable SELF_HOSTED_LABEL) for pushes and same-repository pull requests; a
# fork's pull request stays on GitHub-hosted ubuntu-latest and never reaches nc1. nc1 is a shared, credential-bearing
# host: its runner also refuses bot and fork jobs at admission. Tools come from the flake's `ci` shell, not setup-java
# or setup-python, whose downloaded binaries do not run on NixOS.
permissions:
  contents: read
env:
  NIX_CONFIG: "experimental-features = nix-command flakes"
jobs:
  toolchain-smoke:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SELF_HOSTED_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        if: runner.environment == 'github-hosted'

      - name: Provision resources + compile validator
        run: nix develop .#ci -c bash mcp-server/setup.sh

      - name: Smoke-test the validator (good passes, broken fails)
        run: |
          cd mcp-server
          nix develop ..#ci -c python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from server import validate_sysml_file

          good = validate_sysml_file(path="../test.sysml")
          assert good.get("ok") is True, f"expected test.sysml to validate, got: {good}"

          broken = validate_sysml_file(path="../evals/fixtures/broken_vehicle.sysml")
          assert broken.get("ok") is False, f"expected broken_vehicle.sysml to fail, got: {broken}"

          print("OK: validator accepts valid SysML and rejects the broken fixture.")
          PY
