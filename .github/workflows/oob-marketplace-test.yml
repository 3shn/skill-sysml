name: OOB Marketplace Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# nc1's self-hosted runner (repository variable SELF_HOSTED_LABEL) for pushes and same-repository pull requests; a
# fork's pull request stays on GitHub-hosted ubuntu-latest and never reaches nc1. nc1 is a shared, credential-bearing
# host: its runner also refuses bot and fork jobs at admission. Tools come from the flake's `ci` shell, not setup-java
# or setup-python, whose downloaded binaries do not run on NixOS.
permissions:
  contents: read
env:
  NIX_CONFIG: "experimental-features = nix-command flakes"
jobs:
  test-oob-installation:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SELF_HOSTED_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        if: runner.environment == 'github-hosted'

      - name: Initialize Plugin Dependencies (setup.sh)
        run: |
          nix develop .#ci -c ./mcp-server/setup.sh
          
      - name: Verify OOB MCP Server Startup
        run: |
          chmod +x ./tests/test_mcp_startup.py
          nix develop .#ci -c ./tests/test_mcp_startup.py
